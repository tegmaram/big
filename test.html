<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Game Test Suite — Verify All Games Load</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #0f172a; --card: #1e293b; --text: #f1f5f9;
            --text-dim: #94a3b8; --border: #334155; --accent: #38bdf8;
            --pass: #22c55e; --fail: #ef4444; --pending: #f59e0b;
            --radius: 8px;
        }
        html, body { height: 100%; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
        body { display: flex; flex-direction: column; padding: 20px; gap: 16px; }
        header { border-bottom: 1px solid var(--border); padding-bottom: 12px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; }
        h1 { font-size: 1.25rem; color: var(--accent); }
        .controls { display: flex; gap: 8px; flex-wrap: wrap; }
        button { padding: 8px 14px; border-radius: 6px; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; font-size: 0.9rem; }
        button:hover { border-color: var(--accent); }
        button.primary { background: var(--accent); color: #000; border-color: var(--accent); }
        button.primary:hover { background: #7dd3fc; }
        .summary { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; display: flex; gap: 24px; font-size: 0.9rem; }
        .summary .stat { display: flex; flex-direction: column; gap: 4px; }
        .summary .value { font-size: 1.5rem; font-weight: 700; }
        .pass .value { color: var(--pass); }
        .fail .value { color: var(--fail); }
        .pending .value { color: var(--pending); }
        .results { border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; display: flex; flex-direction: column; height: calc(100vh - 240px); }
        .results-header { background: var(--card); border-bottom: 1px solid var(--border); padding: 12px 16px; font-size: 0.85rem; color: var(--text-dim); display: grid; grid-template-columns: 220px 120px 100px 1fr; gap: 12px; }
        .results-body { overflow: auto; padding: 0; }
        .result-row { padding: 10px 16px; border-bottom: 1px solid var(--border); display: grid; grid-template-columns: 220px 120px 100px 1fr; gap: 12px; align-items: center; font-size: 0.85rem; animation: fadeIn 0.2s ease; }
        .result-row:nth-child(even) { background: rgba(30, 41, 59, 0.3); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
        .name { font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .category { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; color: #fff; width: fit-content; }
        .status { font-weight: 600; font-size: 0.8rem; }
        .status.pass { color: var(--pass); }
        .status.fail { color: var(--fail); }
        .status.pending { color: var(--pending); }
        .error { color: var(--fail); font-size: 0.75rem; margin-top: 4px; }
        .hidden { display: none !important; }
        .progress { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; margin-top: 8px; }
        .progress-bar { height: 100%; background: var(--accent); width: 0%; transition: width 0.2s; }
        a.btn-link { color: var(--accent); text-decoration: none; font-size: 0.85rem; }
        a.btn-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <header>
        <div>
            <h1>🧪 Game Test Suite</h1>
            <p style="color:var(--text-dim); font-size:0.9rem;">Verifies every game loads correctly. Opens each game in a hidden iframe and checks its <code>load</code> event.</p>
        </div>
        <div class="controls">
            <button class="primary" id="btn-run">Run Tests</button>
            <button id="btn-clear">Clear</button>
            <a href="index.html" class="btn-link">← Back to Launcher</a>
        </div>
    </header>

    <div class="summary" id="summary" style="display:none;">
        <div class="stat pass"><span style="color:var(--text-dim)">Passed</span><span class="value" id="val-pass">0</span></div>
        <div class="stat fail"><span style="color:var(--text-dim)">Failed</span><span class="value" id="val-fail">0</span></div>
        <div class="stat pending"><span style="color:var(--text-dim)">Pending</span><span class="value" id="val-pending">0</span></div>
        <div class="stat"><span style="color:var(--text-dim)">Total</span><span class="value" id="val-total">0</span></div>
    </div>

    <div class="progress" style="display:none;" id="progress-wrap">
        <div class="progress-bar" id="progress-bar"></div>
    </div>

    <div class="results">
        <div class="results-header">
            <div>Game</div>
            <div>Category</div>
            <div>Status</div>
            <div>Path</div>
        </div>
        <div class="results-body" id="results-body"></div>
    </div>

    <script>
        const btnRun = document.getElementById("btn-run");
        const btnClear = document.getElementById("btn-clear");
        const summary = document.getElementById("summary");
        const resultsBody = document.getElementById("results-body");
        const progressWrap = document.getElementById("progress-wrap");
        const progressBar = document.getElementById("progress-bar");
        const valPass = document.getElementById("val-pass");
        const valFail = document.getElementById("val-fail");
        const valPending = document.getElementById("val-pending");
        const valTotal = document.getElementById("val-total");

        let games = [];

        async function loadManifest() {
            const res = await fetch("games.json");
            const data = await res.json();
            games = data.games || [];
            valTotal.textContent = games.length;
        }

        function createRow(game) {
            const row = document.createElement("div");
            row.className = "result-row";
            row.id = "row-" + game.id;

            const catInfo = (window.__cats || []).find(c => c.id === game.category) || {};
            const statusCell = document.createElement("div");
            statusCell.className = "status pending";
            statusCell.textContent = "Pending";

            row.innerHTML = `
                <div class="name" title="${escapeHtml(game.name)}">${escapeHtml(game.name)}</div>
                <div><span class="category" style="background:${catInfo.color || '#334155'}">${escapeHtml(catInfo.label || game.category)}</span></div>
                <div></div>
                <div style="color:var(--text-dim); font-size:0.8rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;" title="${escapeHtml(game.path)}">${escapeHtml(game.path)}</div>
            `;
            row.children[2].appendChild(statusCell);
            resultsBody.appendChild(row);
            return { row, statusCell };
        }

        function testGame(game) {
            return new Promise((resolve) => {
                const iframe = document.createElement("iframe");
                iframe.src = game.path;
                iframe.style.position = "absolute";
                iframe.style.left = "-9999px";
                iframe.style.top = "-9999px";
                iframe.style.width = "1px";
                iframe.style.height = "1px";
                iframe.style.border = "none";
                iframe.style.opacity = "0";
                document.body.appendChild(iframe);

                const timeout = setTimeout(() => {
                    cleanup();
                    resolve({ game, ok: false, error: "timeout (5s)" });
                }, 5000);

                const cleanup = () => {
                    clearTimeout(timeout);
                    try { document.body.removeChild(iframe); } catch (e) {}
                };

                iframe.onload = () => {
                    cleanup();
                    resolve({ game, ok: true, error: null });
                };

                iframe.onerror = () => {
                    cleanup();
                    resolve({ game, ok: false, error: "iframe error" });
                };
            });
        }

        async function runTests() {
            await loadManifest();
            resultsBody.innerHTML = "";
            summary.style.display = "block";
            progressWrap.style.display = "block";
            btnRun.disabled = true;

            let pass = 0, fail = 0, skipped = 0;

            const data = await fetch("games.json").then(r => r.json());
            window.__cats = data.categories || [];

            const rows = {};
            games.forEach(g => { rows[g.id] = createRow(g); });

            for (let i = 0; i < games.length; i++) {
                const g = games[i];
                progressBar.style.width = ((i / games.length) * 100) + "%";
                valPending.textContent = games.length - i - skipped - 1;

                const row = rows[g.id];
                const statusCell = row.children[2];
                const pathCell = row.children[3];

                // External games can't be iframed (X-Frame-Options); just validate the URL
                if (g.external) {
                    skipped++;
                    statusCell.textContent = "SKIP";
                    statusCell.className = "status pending";
                    row.style.borderLeft = "4px solid var(--pending)";
                    const hint = document.createElement("div");
                    hint.className = "error";
                    hint.textContent = "External link — skipped (cannot iframe)";
                    pathCell.appendChild(hint);
                    valPass.textContent = pass;
                    valFail.textContent = fail;
                    valPending.textContent = games.length - i - skipped - 1;
                    continue;
                }

                statusCell.textContent = "Testing…";
                statusCell.className = "status pending";

                const result = await testGame(g);

                if (result.ok) {
                    pass++;
                    statusCell.textContent = "PASS";
                    statusCell.className = "status pass";
                    row.style.borderLeft = "4px solid var(--pass)";
                } else {
                    fail++;
                    statusCell.textContent = "FAIL";
                    statusCell.className = "status fail";
                    row.style.borderLeft = "4px solid var(--fail)";
                    const errDiv = document.createElement("div");
                    errDiv.className = "error";
                    errDiv.textContent = result.error;
                    pathCell.appendChild(errDiv);
                }

                valPass.textContent = pass;
                valFail.textContent = fail;
                valPending.textContent = games.length - i - skipped - 1;
            }

            progressBar.style.width = "100%";
            btnRun.disabled = false;
            alert(`Test complete: ${pass} passed, ${fail} failed, ${skipped} external (skipped) out of ${games.length} games.`);
        }

        btnRun.addEventListener("click", runTests);
        btnClear.addEventListener("click", () => {
            resultsBody.innerHTML = "";
            summary.style.display = "none";
            progressWrap.style.display = "none";
            btnRun.disabled = false;
        });

        function escapeHtml(t) {
            const d = document.createElement("div");
            d.textContent = t;
            return d.innerHTML;
        }
    </script>
</body>
</html>
